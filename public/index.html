<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo App - Deployed via NexusCloud IDP</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7280; --accent:#4f46e5; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:48px 24px 24px; text-align:center; }
  h1 { margin:0 0 8px; font-size:2rem; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:#dcfce7; color:var(--ok); font-weight:600; font-size:.9rem; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)} 70%{box-shadow:0 0 0 10px rgba(22,163,74,0)} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0)} }
  p.sub { color:var(--muted); }
  .grid { max-width:880px; margin:24px auto; padding:0 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
  .card { background:var(--card); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .card small { color:var(--muted); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; font-size:.7rem; }
  .card b { font-size:1.15rem; word-break:break-all; }
  .actions { text-align:center; margin:24px; }
  button, a.btn { background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:10px; font-size:.95rem; cursor:pointer; text-decoration:none; margin:4px; display:inline-block; }
  a.btn.alt { background:#e0e7ff; color:var(--accent); }
  .counter { font-size:2.4rem; font-weight:700; color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>🚀 Demo App is Live</h1>
  <span class="badge"><span class="dot"></span><span id="status">Checking...</span></span>
  <p class="sub">Deployed automatically through the NexusCloud Platform</p>
</header>

<section class="grid">
  <div class="card"><small>Version</small><b id="version">-</b></div>
  <div class="card"><small>Environment</small><b id="env">-</b></div>
  <div class="card"><small>Pod / Host</small><b id="host">-</b></div>
  <div class="card"><small>Uptime</small><b id="uptime">-</b></div>
  <div class="card"><small>Node.js</small><b id="node">-</b></div>
  <div class="card"><small>Refreshes (this session)</small><div class="counter" id="count">0</div></div>
</section>

<div class="actions">
  <button onclick="load()">Refresh Info</button>
  <a class="btn alt" href="/health" target="_blank">/health</a>
  <a class="btn alt" href="/api/info" target="_blank">/api/info</a>
  <a class="btn alt" href="/metrics" target="_blank">/metrics</a>
</div>
<footer>NexusCloud demo &bull; GitHub &rarr; Jenkins &rarr; Docker &rarr; Kubernetes &rarr; Prometheus &amp; Grafana</footer>

<script>
  let count = 0;
  const fmt = s => s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's';
  async function load() {
    try {
      const h = await (await fetch('/health')).json();
      document.getElementById('status').textContent = 'Status: ' + h.status;
      const i = await (await fetch('/api/info')).json();
      document.getElementById('version').textContent = 'v' + i.version;
      document.getElementById('env').textContent = i.environment;
      document.getElementById('host').textContent = i.hostname;
      document.getElementById('uptime').textContent = fmt(i.uptimeSeconds);
      document.getElementById('node').textContent = i.node;
      document.getElementById('count').textContent = ++count;
    } catch (e) {
      document.getElementById('status').textContent = 'Status: DOWN';
    }
  }
  load(); setInterval(load, 5000);
</script>
</body>
</html>
