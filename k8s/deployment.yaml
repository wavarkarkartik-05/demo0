apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexuscloud-demo-app
  labels:
    app: nexuscloud-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexuscloud-demo-app
  template:
    metadata:
      labels:
        app: nexuscloud-demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER   # e.g. youruser/nexuscloud-demo-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
